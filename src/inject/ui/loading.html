<!DOCTYPE html>
<html lang="en" class="{{THEME}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drizzle Gateway</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #fafafa;
      color: #09090b;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .dark body {
      background-color: #09090b;
      color: #f4f4f5;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Logo icon container */
    .logo-wrapper {
      position: relative;
      width: 54px;
      height: 54px;
      margin-bottom: 20px;
    }

    .logo-bg {
      position: absolute;
      inset: -4px;
      border-radius: 14px;
      background: radial-gradient(circle, rgba(197, 247, 79, 0.25) 0%, rgba(197, 247, 79, 0) 70%);
      filter: blur(12px);
      animation: pulseGlow 2.5s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.85); opacity: 0.35; }
      100% { transform: scale(1.2); opacity: 0.85; }
    }

    .logo-svg {
      position: relative;
      width: 54px;
      height: 54px;
      border-radius: 12px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
      display: block;
    }

    /* Staggered raindrop animation */
    .drop-1 { animation: dropAnim 1.6s ease-in-out infinite 0.0s; }
    .drop-2 { animation: dropAnim 1.6s ease-in-out infinite 0.2s; }
    .drop-3 { animation: dropAnim 1.6s ease-in-out infinite 0.4s; }
    .drop-4 { animation: dropAnim 1.6s ease-in-out infinite 0.6s; }

    @keyframes dropAnim {
      0%, 100% {
        opacity: 0.35;
        transform: translateY(0);
      }
      50% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    .title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.015em;
      margin-bottom: 6px;
    }

    .status-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
    }

    .status-text {
      font-size: 13px;
      color: #71717a;
      font-weight: 400;
    }

    .dark .status-text {
      color: #a1a1aa;
    }

    /* Sleek minimal progress bar */
    .progress-track {
      width: 130px;
      height: 3px;
      background-color: rgba(0, 0, 0, 0.06);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .dark .progress-track {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .progress-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 40%;
      background: linear-gradient(90deg, transparent, #c5f74f, transparent);
      border-radius: 9999px;
      animation: indeterminate 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes indeterminate {
      0% {
        left: -40%;
        width: 30%;
      }
      50% {
        width: 50%;
      }
      100% {
        left: 100%;
        width: 30%;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrapper">
      <div class="logo-bg"></div>
      <svg class="logo-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" rx="8" fill="#17161B" />
        <path class="drop-1" d="M8.10752 16.6577C8.44369 16.0953 9.19471 15.8957 9.78497 16.2118C10.3752 16.5279 10.5812 17.24 10.245 17.8024L6.29891 24.404C5.96274 24.9664 5.21172 25.1661 4.62146 24.85C4.0312 24.5339 3.82522 23.8217 4.16139 23.2593L8.10752 16.6577Z" fill="#C5F74F"/>
        <path class="drop-2" d="M16.6132 11.596C16.9494 11.0336 17.7004 10.8339 18.2907 11.15C18.8809 11.4661 19.0869 12.1783 18.7507 12.7407L14.8046 19.3423C14.4684 19.9047 13.7174 20.1043 13.1272 19.7882C12.5369 19.4721 12.3309 18.76 12.6671 18.1976L16.6132 11.596Z" fill="#C5F74F"/>
        <path class="drop-3" d="M21.1932 16.6577C21.5294 16.0953 22.2804 15.8957 22.8706 16.2118C23.4609 16.5279 23.6669 17.24 23.3307 17.8024L19.3846 24.404C19.0484 24.9664 18.2974 25.1661 17.7071 24.85C17.1169 24.5339 16.9109 23.8217 17.2471 23.2593L21.1932 16.6577Z" fill="#C5F74F"/>
        <path class="drop-4" d="M29.7011 11.5962C30.0373 11.0339 30.7883 10.8342 31.3785 11.1503C31.9688 11.4664 32.1748 12.1786 31.8386 12.7409L27.8925 19.3425C27.5563 19.9049 26.8053 20.1046 26.215 19.7885C25.6248 19.4724 25.4188 18.7602 25.755 18.1978L29.7011 11.5962Z" fill="#C5F74F"/>
      </svg>
    </div>
    <h2 class="title">Drizzle Gateway</h2>
    <div class="status-container">
      <span class="status-text">{{MESSAGE}}</span>
    </div>
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
  </div>
</body>
</html>
